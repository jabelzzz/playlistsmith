version: "3.8"
services:
  playlistsmith:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      # Must exactly match a Redirect URI registered in Spotify's dashboard.
      - SPOTIPY_REDIRECT_URI=${SPOTIPY_REDIRECT_URI}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    healthcheck:
      # python, not curl: the python:3.13-slim base image ships no curl, so a
      # curl-based probe never turns healthy and blocks the deploy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
